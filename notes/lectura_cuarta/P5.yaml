    & KiDS-1000, DES-Y3 / current'
  debe_decir: $S_8 = \val{S8_leg_pred}$ ($A_s$ clavado al CMB del modelo; ver \S\ref{subsec:S8}) & $\val{S8_leg_pred}\pm\text{...}$
    & $\val{S8_leg_tension}\sigma$ de KiDS-Legacy ($\val{S8_legacy_dato}\pm\val{S8_legacy_dato_sigma}$);
    el 0.827 es un TECHO con $A_s$ fijado a Planck, no la prediccion & KiDS-Legacy / current
  evidencia: 'El resto del documento (abstract L138-148, nota de margen L1138-1151, \S1204-1226, footnote
    L149-156) etiqueta explicitamente el S8=0.827 (A_s fijado a Planck) como ''ceiling under an imported
    normalisation, NOT a prediction'', y da la prediccion vigente con A_s libre o clavado al CMB propio
    (S8_leg_pred=0.8273 vs 0.8265+-0.0176, 0.04sigma, Paper 6 / CLAUDE.md ''S8 titular''). La tabla de
    predicciones falsables (tab:falsifiable, la que fija el criterio de falsacion del modelo) sigue usando
    el techo retirado como ''SSEE value'' y como blanco de falsacion (S8>0.86 favorece SSEE), sin la salvedad
    ni el numero titular. Esto repite exactamente el patron que motivo esta cuarta lectura (fila ''c_s^2=1
    canonical'' que sobrevivio tres lecturas): una tabla de resumen/falsabilidad queda desactualizada
    aunque el cuerpo del texto ya se corrigio.'
