notas_generales:
  - "P10 es, de los documentos revisados hasta ahora, el que mas usa \\val correctamente en el CUERPO del texto (todas las cadenas algebraicas criticas: alpha, M4, sK_full, H0_GLOBAL via las ecuaciones principales). El patron de FIX dominante aqui es 'macro existente, no usada en abstract/tablas', igual que en P8 -- NO hay numeros retirados (72.86, 73.040, beta_c=-AURA, particula phi-DM, s_m=0.160 como densidad) presentados como vigentes: los unicos valores retirados que aparecen (67.037/71.87/1.12sigma, 69.96/1.54) estan correctamente narrados como historia superada."
  - "Confirmado con ssee_core: r=12*alpha/N^2 con alpha=phi^4/3 y N=2*phi^7 es IDENTICO algebraicamente a phi^-10 (ambas dan 0.0081306...), consistente con la pregunta del coordinador."
  - "La linea 985 que parecia LaTeX roto NO lo esta: el .tex vigente ya usa \\val{H0_GLOBAL_d5} ahi; lo que se veia roto era un artefacto del script de inventario, que borra las macros \\val antes de listar numeros sueltos."
