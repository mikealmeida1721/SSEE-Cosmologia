afirmaciones:
  - {archivo: SSEE_Paper10_UVCompletion.tex, linea: "938 (Tabla 'Consistency with the SSEE suite', fila Paper 8)", dice: "Paper 8 & $\\MIRA = \\AURA/2$; Vainshtein $r_V \\propto 1/M^2$ & $r_V$ enlarged to $\\sim 10^{44}$ m at UV; double GR protection", debe_decir: "Paper 8 & $\\MIRA=\\AURA/2$; selective coupling + $\\alpha_B=\\alpha_M=\\alpha_T=0$ (double GR protection) & Mechanism independent of $M$; Paper~8 withdrew its k-mouflage screening radius (dimensionally inconsistent) and does not quote $r_V$", evidencia: "SSEE_Paper8_StrongGravity.tex L553: 'We do not quote a k-mouflage screening radius. Earlier versions of this paper did, from r_km^3=M_obj/(4*pi*Mpl*M^2); in natural units the RHS has dimension [mass]^-2=[length]^2, not [length]^3, so the expression is NOT dimensionally consistent and its numerical values changed by a factor 10^3... Those values are withdrawn.' (L554-559). P10 le atribuye a P8 una formula r_V∝1/M^2 y una cifra numerica (10^44 m) que NO existen en ningun log, macro ni en el propio P8 -- es el mismo tipo de numero retirado que esta lectura busca cazar, sólo que aqui aparece citado de vuelta en OTRO paper despues de haber sido retirado en el original. Es el hallazgo mas grave de esta lectura."}
  - {archivo: SSEE_Paper10_UVCompletion.tex, linea: "638 (Route B, M^4_r2)", dice: "$M^4_{\\rm r2} \\approx 4.1\\,\\rhoc$", debe_decir: "$M^4_{\\rm r2} \\approx 8.20\\,\\rhoc$", evidencia: "La propia ecuacion del parrafo (2*sK_IR*KAL0^2/3) da 8.1967 con los valores algebraicos de SSEE (sK_IR=0.403302, KAL0=5.521406), verificado con ssee_core. El 4.1 escrito es casi exactamente la mitad del resultado correcto -- parece un factor de 2 perdido en el calculo a mano. No afecta la conclusion cualitativa del parrafo (Route B tampoco da 5*phi^8=234.9), pero el numero mostrado no reproduce su propia formula."}
