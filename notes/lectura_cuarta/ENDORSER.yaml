  - "Patron dominante: igual que P8/P10, la mayoria de los numeros SSEE (c_s^2, r=phi^-10, los cinco numeros de la tabla chi2 de KiDS-Legacy, el residuo H0, etc.) YA tienen macro \\val en valores_generados.tex pero el .tex los teclea a mano. Ningun numero retirado (72.86, 73.040, beta_c=-AURA, s_m=0.160 como densidad) aparece presentado como vigente."
