afirmaciones:
  - {archivo: SSEE_Endorser_Summary.tex, linea: "111-114", dice: "A dimensional defect in the Vainshtein-radius equation of this paper is open and under repair (OP-4, reopened 2026-09); it does not enter the canonical-limit prediction, which rests on $\\omega_c$ and on $\\alpha_B=\\alpha_M=0$.", debe_decir: "Paper~8 withdrew its Vainshtein/k-mouflage screening-radius formula outright (dimensionally inconsistent: OP-4 \\textbf{closed 2026-10-03} by retracting the radius, not by repairing it); it does not enter the canonical-limit prediction, which rests on $\\omega_c$ and on $\\alpha_B=\\alpha_M=0$.", evidencia: "OPEN_PROBLEMS.md L310: 'OP-4 — Vainshtein Radius Exceeds Observable Universe (Paper 8) — CERRADO 2026-10-03 (por retiro del radio)'. SSEE_Paper8_StrongGravity.tex L553-559 (texto vigente, verificado en esta misma lectura): 'We do not quote a k-mouflage screening radius... Those values are withdrawn.' OP-4 no esta 'reopened... under repair': esta CERRADO por retiro completo de la formula, no por una reparacion pendiente. Este es el hallazgo mas grave de ENDORSER: es el documento que leen primero los endorsers de arXiv y describe un estado de hace mas de un mes como si fuera el actual."}
  - {archivo: SSEE_Endorser_Summary.tex, linea: "71-90 (parrafo Paper 6)", dice: "todo el parrafo de Paper 6 (retiro de la particula phi-DM, titular KiDS-Legacy S8=0.8273 vs 0.8265+-0.0176, chi2 417.97/418.34/418.95, control KiDS-1000 como antecedente)", debe_decir: "sin cambio de contenido -- es el parrafo MAS actualizado de todo el documento: usa el titular vigente (KiDS-Legacy, no KiDS-1000), narra correctamente el retiro de la particula y distingue 'no temporal priority is claimed' (ver project_kids_legacy_no_prioridad). Solo requiere los FIX-lite de macro ya listados (L79,80,82,83,84,85).", evidencia: "comparado linea por linea contra CLAUDE.md banner Paper 6 y la entrada MEMORY project_kids_legacy_no_prioridad; coincide en valores y en la frase de no-prioridad temporal."}
  - {archivo: SSEE_Endorser_Summary.tex, linea: "33-35 (Core idea)", dice: "The dark-sector ans\\\"atze that previously appeared here ($m_\\varphi$, $\\xi$) were retracted in 2026-08 together with the second matter sector, and their register entries (OP-9 through OP-12) close by dissolution; the MIRA matter mechanism (OP-8) had already dissolved under the $\\omega_m$-direct reframe.", debe_decir: "sin cambio -- correcto y vigente: coincide con el banner rojo de CLAUDE.md (particula phi-DM retirada 2026-08-01) y con el cierre de OP-8/OP-9..OP-12 documentado en OPEN_PROBLEMS.md. Es, junto con el parrafo de Paper 6, de los pasajes mejor actualizados del documento.", evidencia: "cruce directo con CLAUDE.md banner particula retirada y con OPEN_PROBLEMS.md (OP-8, OP-9..OP-12 cerrados por disolucion)."}
notas_generales:
