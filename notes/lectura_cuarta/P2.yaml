    reconcilian entre sí: N_s/tau_max debería ser 25000/32.7=764.5 (no 183.5), y N_eff debería ser N_w×(N_s/tau_max)=18,350 (no 4402) — hay un factor ~4.17 de diferencia interno, IGUAL en las 3 filas (SSEE/ΛCDM/CPL),
    lo que sugiere una definición distinta de N_eff (p.ej. con thinning, o N_w efectivo=24) nunca documentada. El run más cercano que SÍ corre hoy (mcmc_paper2_3models_wmfix.log) da para estos mismos 3
    modelos: tau_max=(31.9,39.1,57.3), N_eff=(78380,64007,43637), accept=(0.714,0.646,0.550) — el tau_max de CPL coincide (57.3) pero N_eff y accept NO. Es decir: la Tabla de convergencia del PDF describe
    una corrida que ya no es la vigente en el repo, o usa una definición de N_eff sin documentar.'
