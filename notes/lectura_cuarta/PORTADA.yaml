afirmaciones:
  - {archivo: SSEE_Cover.tex, linea: "48 y 50 (misma pagina, dos ecuaciones adyacentes de la textura decorativa)", dice: "{$f_{\\rm screen}=\\dfrac{\\pi-\\varphi}{(\\varphi+\\pi)^2}$} ... {$H_0^{\\rm glob}=H_{\\rm SH0ES}(1-f_{\\rm screen})\\simeq3(\\varphi+\\pi)^2$}", debe_decir: "{$f_{\\rm screen}^{\\rm full}=s_K^{\\rm full}/(3\\,\\MIRA)$, $s_K^{\\rm full}=s_K^{\\rm IR}+UV_{\\rm corr}$} ... {$H_0^{\\rm glob}=H_{\\rm SH0ES}(1-f_{\\rm screen}^{\\rm full})\\simeq3(\\varphi+\\pi)^2$} -- o, si se prefiere mantener la formula simple y bonita de $(\\pi-\\varphi)/(\\varphi+\\pi)^2$ por motivos esteticos, anadir el superindice IR y quitar el '\\simeq3(\\varphi+\\pi)^2' de esa pagina (son dos aproximaciones de calidad MUY distinta: residuo 4.2e-6 vs 0.166 km/s/Mpc, 0.17sigma)", evidencia: "la formula mostrada $(\\pi-\\varphi)/(\\varphi+\\pi)^2$ es ALGEBRAICAMENTE IDENTICA a F_SCREEN_IR_d6=0.067253 (verificado con ssee_core: (PI-PHI)/(PHI+PI)**2 = 0.067253), que es SOLO el termino IR de Paper 9. Con ese f_screen, H_SH0ES*(1-f_IR)=73.04*(1-0.067253)=68.13 km/s/Mpc -- NO 67.96214 (el blanco puro mostrado en la misma linea 50). El emparejamiento visual de ambas ecuaciones en la misma pagina, sin distinguir IR de completo, sugiere al lector que esa formula simple cierra el '≃3(φ+π)²' con precision -- lo que solo es cierto con el f_screen COMPLETO (IR+UV=0.069522, residuo +4.2e-6), no con el IR solo (que queda a 0.17σ, 0.166 km/s/Mpc de distancia). Es exactamente el tipo de confusion que el banner de CLAUDE.md marca como retirada ('f_screen variando con z' y la distincion IR vs completo). No hay cifras incorrectas en la pagina (ninguna de las dos ecuaciones muestra un numero), pero la yuxtaposicion es la forma visual de la misma ambiguedad conceptual."}
  - {archivo: SSEE_Cover.tex, linea: "45,47 (arquitectura del documento)", dice: "SSEE_Cover.tex no usa \\input{valores_generados.tex} ni macros \\val -- es un documento TikZ standalone con su propio preambulo", debe_decir: "no es un error a corregir (la portada es una pieza grafica, no un documento de resultados citables), pero se deja registrado: los dos valores numericos que SI aparecen en la portada (w0=-0.839950, wa=-0.669975) estan tecleados a mano y COINCIDEN con W0_d6/WA_d6 al redondeo mostrado -- si alguna vez w0 o wa cambian de valor canonico, esta portada NO se actualizaria automaticamente como los demas documentos.", evidencia: "grep en SSEE_Cover.tex no encuentra '\\input' ni '\\val'; comparacion manual contra algebra_derivada.json#nucleo.W0/WA confirma que los valores actuales son correctos."}
notas_generales:
  - "PORTADA es casi enteramente TIPOGRAFIA/DISEÑO: de las ~26 cifras que capturo inventario.py, 21 son coordenadas, rotaciones u opacidades de tikz, no resultados a reproducir. Solo 2 ecuaciones muestran un valor numerico (w0, wa), ambos correctos."
  - "Ningun numero retirado (72.86, 73.040, beta_c=-AURA, particula phi-DM, s_m=0.160 como densidad, radios Vainshtein) aparece en la portada: de las 6 ecuaciones restantes (Omega, n_s, f_screen, Omega_m, H_0^glob, S_8) ninguna muestra cifra, son formulas puras. El unico hallazgo real es conceptual (afirmacion sobre f_screen IR vs completo), no un numero equivocado."
  - "Verificado con ssee_core.py: (PI-PHI)/(PHI+PI)**2 = 0.067253 (identico a F_SCREEN_IR_d6); confirma la lectura de la afirmacion principal."
