afirmaciones:
  - {archivo: SSEE_Paper8_StrongGravity.tex, linea: "579-580 y 970-974", dice: "This mechanism operates independently of the value of $M$ and holds in both the IR ($M=\\Mpl$) and UV ($M=9.68$ meV) limits. [...] This is a cosmological-scale cutoff --- thirty orders of magnitude below $\\Mpl$", debe_decir: "sin cambio -- es correcto: M_UV=9.68 meV vs M_Pl=1.22e19 GeV, la razon es ~45 ordenes de magnitud en masa pero la frase habla del cutoff cosmologico siendo 'treinta ordenes por debajo de Mpl' en el contexto de escalas de energia relevantes (verificar si '30' es exacto)", evidencia: "log10(1.22e28 meV / 9.68 meV) = 27.1, no 30. Ratio Mpl/M = 1.22e19 GeV / 9.68e-3 eV = 1.26e30 -> log10=30.1. CONFIRMADO: 30 ordenes de magnitud es correcto si se usa Mpl en GeV y M en eV correctamente (1.22e19 GeV = 1.22e28 eV; 1.22e28/9.68e-3=1.26e30). Sin fix necesario, solo lo deje registrado porque no estaba en el inventario de numeros."}
  - {archivo: SSEE_Paper8_StrongGravity.tex, linea: "53-91 (abstract) y 775-799 (caja de alcance)", dice: "el abstract y la caja de falsabilidad ya narran correctamente que la particula phi-DM fue retirada (2026-08-01) y que la prediccion de lensing es incondicional por omega_c (OP-8) + alpha_B=alpha_M=alpha_T=0 (P7)", debe_decir: "sin cambio -- esto YA REFLEJA el modelo de hoy segun CLAUDE.md (seccion Paper 8, 'RESUELTO 2026-08-02'). Es uno de los pocos documentos donde el banner de retiro de particula esta COMPLETAMENTE propagado, con cajas de 'withdrawn' explicitas en cada seccion afectada (geodesic, mira, lensing, falsify, conclusions).", evidencia: "Comparacion linea por linea con el banner rojo de CLAUDE.md (particula retirada 2026-08-01) y con 'P8: RESUELTO 2026-08-02' en la tabla de papers. Coincide en las dos razones (omega_c forward + alpha_B=alpha_M=alpha_T=0), sin overclaim."}
  - {archivo: SSEE_Paper8_StrongGravity.tex, linea: "887-889 (f_screen^IR)", dice: "$f_{\\rm screen}^{\\rm IR} = s_K^{\\rm IR}/(3\\,\\MIRA)$, $s_K^{\\rm IR}=-3w_0(1+w_0)=\\val{S_K_d6}$", debe_decir: "sin cambio -- correctamente etiquetado como 'IR' en ambos simbolos (f_screen^IR, s_K^IR), consistente con el banner de CLAUDE.md que distingue el regimen IR (68.13, no canonico) del H_global unico canonico (67.962142, que usa s_K completo = IR+UV). El paper NO afirma que esto sea el H_global completo, solo cita la pieza de Paper 9 que le interesa a la seccion de MIRA.", evidencia: "s_K^IR=-3*W0*(1+W0) con ssee_core.W0=-0.839950 da 0.403302, coincide exacto con macro S_K_d6 y con el banner (s_K^full=s_K^IR+UV_corr=0.403302+0.013603)."}
