    deps:
      - src/estadistica/ssee_dic_from_chains.py
      - src/procedencia.py
      - /mnt/datos/SSEE_data/mcmc/paper2_3models/mcmc_chains_professional.npz
    outs:
      - results/logs/dic_from_chains.json:
          cache: false
      - results/logs/dic_from_chains.log:
          cache: false
  ajuste_conjunto_SSEE:
    cmd: OMP_NUM_THREADS=1 nice -n 10 .venv/bin/python3 src/p03_cmb/ajuste_conjunto_wc_ns.py SSEE
    deps:
