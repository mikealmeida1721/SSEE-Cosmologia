# dvc.yaml — la CADENA DE PROCEDENCIA del modelo (2026-09-30, decision de Mike).
# Cada etapa: el comando que produce un resultado, TODO lo que lee (script,
# modulos, datos, cadenas) y lo que escribe. `dvc.lock` guarda el sha de cada
# cosa: `dvc status` dice que resultado ya no corresponde a su codigo o a sus
# datos, y `dvc repro` rehace solo lo afectado. Un log editado a mano no cuadra
# con su hash. Las salidas llevan `cache: false`: se hashean, no se duplican
# (siguen en git como siempre). Cada salida lleva ademas su ACTA dentro
# (src/procedencia.py): commit, hashes, argumentos, nucleos.
# Se migra aqui, etapa por etapa, lo que hoy vive en PROPAGACION.yaml.
