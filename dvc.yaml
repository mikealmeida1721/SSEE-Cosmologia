# dvc.yaml — la CADENA DE PROCEDENCIA del modelo (2026-09-30, decision de Mike).
# Cada etapa: el comando que produce un resultado, TODO lo que lee (script,
# modulos, datos, cadenas) y lo que escribe. `dvc.lock` guarda el sha de cada
# cosa: `dvc status` dice que resultado ya no corresponde a su codigo o a sus
# datos, y `dvc repro` rehace solo lo afectado. Un log editado a mano no cuadra
# con su hash. Las salidas llevan `cache: false`: se hashean, no se duplican
# (siguen en git como siempre). Cada salida lleva ademas su ACTA dentro
# (src/procedencia.py): commit, hashes, argumentos, nucleos.
# Se migra aqui, etapa por etapa, lo que hoy vive en PROPAGACION.yaml.
stages:
  mcmc_full_posteriores:
    cmd: OMP_NUM_THREADS=1 nice -n 19 .venv/bin/python3 src/mcmc_full/leer_mcmc_full.py
    deps:
      - src/mcmc_full/leer_mcmc_full.py
      - src/procedencia.py
      - /mnt/datos/SSEE_data/mcmc/mcmc_full/c1/ssee_full.1.txt
      - /mnt/datos/SSEE_data/mcmc/mcmc_full/c2/ssee_full.1.txt
      - /mnt/datos/SSEE_data/mcmc/mcmc_full/c3/ssee_full.1.txt
      - /mnt/datos/SSEE_data/mcmc/mcmc_full/c4/ssee_full.1.txt
    outs:
      - results/logs/mcmc_full_posteriores.json:
          cache: false
  s8_desde_b1:
    cmd: OMP_NUM_THREADS=1 nice -n 19 .venv/bin/python3 src/p06_growth/s8_desde_b1.py
    deps:
      - src/p06_growth/s8_desde_b1.py
      - src/procedencia.py
      - src/ssee_core.py
      - results/chains/ssee_cmb.1.txt
      - results/chains/lcdm_cmb.1.txt
      - results/logs/b1_analyse.log
      - CANONICAL_VALUES.yaml
    outs:
      - results/logs/s8_desde_b1.json:
          cache: false
  valores_tex:
    cmd: .venv/bin/python3 src/valores_tex.py
    deps:
      - src/valores_tex.py
      - manuscript/valores.yaml
      - results/logs/s8_desde_b1.json
      - results/logs/kids_publicados.json
      - results/logs/p10_uv_fscreen.json
      - results/logs/algebra_derivada.json
      - results/logs/kids_legacy_bic.json
      - results/logs/paper3_cmb_chi2.json
      - results/logs/lya_auditoria.json
      - results/logs/hiclass_campo.json
      - results/logs/resumen_3modelos.json
      - results/logs/savage_cv.json
      - results/logs/dic_from_chains.json
      - results/logs/press_schechter.json
    outs:
      - manuscript/valores_generados.tex:
          cache: false
  p5_IS_perturbations:
    cmd: OMP_NUM_THREADS=1 MPLBACKEND=Agg nice -n 10 .venv/bin/python3 src/p05_IS/ssee_paper5_IS_perturbations.py > results/logs/p5_IS_perturbations.log 2>&1
    deps:
      - src/p05_IS/ssee_paper5_IS_perturbations.py
      - src/procedencia.py
      - src/ssee_core.py
    outs:
      - results/logs/p5_IS_perturbations_Q2.json:
          cache: false
      - results/logs/p5_IS_perturbations_Q3.json:
          cache: false
      - results/logs/p5_IS_perturbations.log:
          cache: false
  kids_publicados:
    cmd: OMP_NUM_THREADS=1 nice -n 10 .venv/bin/python3 src/p06_growth/kids_publicados.py
    deps:
      - src/p06_growth/kids_publicados.py
      - src/procedencia.py
      - /mnt/datos/SSEE_data/kids_legacy/KiDS_Legacy_cosmic_shear_data_release/chains_and_config_files/xipm/output_nautilus_xipm_Fiducial.txt
      - /mnt/datos/SSEE_data/kids1000/KiDS1000_cosmis_shear_data_release/chains_and_config_files/main_chains_iterative_covariance/xipm/chain/maxpost_multinest_start_C.txt
      - results/logs/growth_2026-07/R3_ssee_kids_S8.json
      - results/logs/growth_2026-07/R4_lcdm_kids_S8.json
    outs:
      - results/logs/kids_publicados.json:
          cache: false
  p10_uv_fscreen:
    cmd: OMP_NUM_THREADS=1 nice -n 10 .venv/bin/python3 src/p10_uv/ssee_paper10_verification.py > /dev/null
    deps:
      - src/p10_uv/ssee_paper10_verification.py
      - src/procedencia.py
      - src/ssee_core.py
    outs:
      - results/logs/p10_uv_fscreen.json:
          cache: false
  prueba_equivalencia_hglob:
    cmd: OMP_NUM_THREADS=1 nice -n 10 .venv/bin/python3 src/verificacion/prueba_equivalencia_hglob.py
    deps:
      - src/verificacion/prueba_equivalencia_hglob.py
      - src/procedencia.py
      - src/ssee_core.py
      - results/logs/cmb_dbic_tau_ajustado.json
      - src/p03_cmb/cmb_eval.py
      - src/p02_mcmc/chi2_bao_posterior.py
      - src/p06_growth/cobaya_kids_legacy.py
    outs:
      - results/logs/prueba_equivalencia_hglob.json:
          cache: false
  spt3g_calibrador:
    cmd: OMP_NUM_THREADS=1 nice -n 10 .venv/bin/python3 src/p11_sondas/spt3g_calibra.py lee
    deps:
      - src/p11_sondas/spt3g_calibra.py
      - src/procedencia.py
      - /mnt/datos/SSEE_data/cmb_lensing/spt3g_calibrador/spt_lcdm.1.txt
      - /mnt/datos/SSEE_data/cmb_lensing/spt3g_calibrador/spt_lcdm.2.txt
      - /mnt/datos/SSEE_data/cmb_lensing/spt3g_calibrador/spt_lcdm.3.txt
      - /mnt/datos/SSEE_data/cmb_lensing/spt3g_calibrador/spt_lcdm.4.txt
      - /mnt/datos/SSEE_data/cmb_lensing/spt3g_calibrador/spt_lcdm.progress
      - /mnt/datos/SSEE_data/cmb_lensing/papers/2608.31136/sec8_summary.tex
      - /mnt/datos/SSEE_data/cmb_lensing/spt3g/cobaya/SPT3G_D1_KK/base_lens/gmv.yaml
    outs:
      - results/logs/spt3g_calibrador.json:
          cache: false
  algebra_derivada:
    cmd: .venv/bin/python3 src/algebra_derivada.py
    deps:
      - src/algebra_derivada.py
      - src/procedencia.py
      - src/ssee_core.py
    outs:
      - results/logs/algebra_derivada.json:
          cache: false
  kids_legacy_bic:
    cmd: OMP_NUM_THREADS=1 nice -n 10 .venv/bin/python3 src/p06_growth/kids_legacy_bic.py
    deps:
      - src/p06_growth/kids_legacy_bic.py
      - src/procedencia.py
      - CANONICAL_VALUES.yaml
      - /mnt/datos/SSEE_data/chains_p6/kids_legacy/sseefijo.1.txt
      - /mnt/datos/SSEE_data/chains_p6/kids_legacy/sseefijo.2.txt
      - /mnt/datos/SSEE_data/chains_p6/kids_legacy/sseefijo.3.txt
      - /mnt/datos/SSEE_data/chains_p6/kids_legacy/sseefijo.4.txt
      - /mnt/datos/SSEE_data/chains_p6/kids_legacy/ssee.1.txt
      - /mnt/datos/SSEE_data/chains_p6/kids_legacy/ssee.2.txt
      - /mnt/datos/SSEE_data/chains_p6/kids_legacy/ssee.3.txt
      - /mnt/datos/SSEE_data/chains_p6/kids_legacy/ssee.4.txt
      - /mnt/datos/SSEE_data/chains_p6/kids_legacy/lcdmfijo.1.txt
      - /mnt/datos/SSEE_data/chains_p6/kids_legacy/lcdmfijo.2.txt
      - /mnt/datos/SSEE_data/chains_p6/kids_legacy/lcdmfijo.3.txt
      - /mnt/datos/SSEE_data/chains_p6/kids_legacy/lcdmfijo.4.txt
    outs:
      - results/logs/kids_legacy_bic.json:
          cache: false
  paper3_cmb:
    cmd: export OMP_NUM_THREADS=1 MPLBACKEND=Agg; (.venv/bin/python3 src/verificacion/preflight.py && nice -n 10 .venv/bin/python3 src/p03_cmb/ssee_paper3_cmb.py) > results/logs/paper3_cmb_reframe.log 2>&1
    deps:
      - src/p03_cmb/ssee_paper3_cmb.py
      - src/procedencia.py
      - src/ssee_core.py
      - data/raw/planck_pr4_TT.txt
      - data/raw/planck_pr4_TE.txt
      - data/raw/planck_pr4_EE.txt
      - data/raw/planck_pr4_lensing.txt
    outs:
      - results/logs/paper3_cmb_chi2.json:
          cache: false
      - results/logs/paper3_cmb_reframe.log:
          cache: false
  lya_auditoria:
    cmd: OMP_NUM_THREADS=1 nice -n 10 .venv/bin/python3 src/p02_mcmc/lya_auditoria.py
    deps:
      - src/p02_mcmc/lya_auditoria.py
      - src/procedencia.py
      - src/ssee_core.py
      - src/bao_camb.py
      - src/desi_dr2_data.py
      - src/p11_sondas/lcdm_planck.py
      - data/raw/desi_dr2_bao.csv
      - results/logs/bao_lcdm_planck.json
    outs:
      - results/logs/lya_auditoria.json:
          cache: false
  hiclass_campo:
    cmd: OMP_NUM_THREADS=1 nice -n 10 .venv/bin/python3 src/p07_eft/hiclass_campo.py
    deps:
      - src/p07_eft/hiclass_campo.py
      - src/procedencia.py
      - src/ssee_core.py
      - /mnt/datos/hi_class/class
    outs:
