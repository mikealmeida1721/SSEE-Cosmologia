      - src/p03_cmb/cmb_eval.py
      - src/procedencia.py
      - src/ssee_core.py
      - src/p11_sondas/lcdm_planck.py
      - results/logs/cmb_ajuste_conjunto_wc_ns.json
    outs:
      - results/logs/cmb_ajuste_conjunto_wc_ns_SSEE.json:
          cache: false
  ajuste_conjunto_LCDM:
    cmd: OMP_NUM_THREADS=1 nice -n 10 .venv/bin/python3 src/p03_cmb/ajuste_conjunto_wc_ns.py LCDM
    deps:
      - src/p03_cmb/ajuste_conjunto_wc_ns.py
      - src/p03_cmb/cmb_eval.py
      - src/procedencia.py
      - src/ssee_core.py
      - src/p11_sondas/lcdm_planck.py
      - results/logs/cmb_ajuste_conjunto_wc_ns.json
    outs:
      - results/logs/cmb_ajuste_conjunto_wc_ns_LCDM.json:
          cache: false
  press_schechter:
    cmd: OMP_NUM_THREADS=1 MPLBACKEND=Agg nice -n 10 .venv/bin/python3 src/p02_mcmc/ssee_press_schechter.py > results/logs/press_schechter.log 2>&1
    deps:
      - src/p02_mcmc/ssee_press_schechter.py
      - src/procedencia.py
      - src/ssee_core.py
      - CANONICAL_VALUES.yaml
      - results/logs/deltac_spherical_collapse.json
      - results/logs/p5_IS_perturbations_Q3.json
    outs:
