  # BAO 1.1e-5, KiDS 2.9e-6; su control (salto x1000 en H) SI se ve en las
  # tres. Fuera a proposito: multisonda y h0_lente (otras sondas u otros
  # commits sin revisar), b1_analyse (su codigo de analisis cambio de verdad).
  paper3_cmb_reframe: 2026-09-30
  kids_legacy_ssee: 2026-09-30
  kids_legacy_sseefijo: 2026-09-30
  kids_legacy_lcdmfijo: 2026-09-30
