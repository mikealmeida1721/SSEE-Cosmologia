# porque la cadena está CERTIFICADA por postflight.py, no por confianza:
#   ssee_cmb  R−1=0.0170 · 53872 muestras · χ² coherente 1.5e-4 · mínimo al 69%
#   lcdm_cmb  R−1=0.0187 · 95760 muestras · χ² coherente 1.5e-4 · mínimo al 75%
# El resultado del análisis vigente vive en b1_analyse.log, que SÍ vigila R35.
