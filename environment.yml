name: ssee
# Una sola lista de paquetes: requirements.txt. Este archivo sólo fija Python y
# delega en ella (2026-10-10: environment.yml se había quedado en numpy>=1.24
# después de que requirements.txt lo corrigiera, y le faltaban 6 paquetes).
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
    - -r requirements.txt
