# ============================================================
# CLASS input file: SSEE-V3.6 — DOS SECTORES (φ-DM + CDM)
# Fase 2: Implementación del sector φ-DM mediante ncdm
#
# Sector CDM:  Omega_cdm = 0.160   (materia fría activa)
# Sector φ-DM: ncdm con m_phi = 36.95 eV  → suprime P(k) para k > k_fs
#
# La temperatura T_ncdm se calibra para que k_fs ≈ 0.659 h/Mpc
# según la relación Dodelson-Widrow del Paper 6
# ============================================================

output = tCl,pCl,lCl,mPk
lensing = yes
l_max_scalars = 2500
P_k_max_h/Mpc = 1.0

# --- SSEE Dark Energy (sin cambios) ---
Omega_fld = 0.8399
w0_fld = -0.8399
wa_fld = -0.6699
cs2_fld = 1.0

# --- Sector materia: CDM activo (Omega_m,dyn del Paper 5) ---
Omega_b = 0.048432
Omega_cdm = 0.111568        # 0.160 - Omega_b = materia fría activa

# --- Sector φ-DM: Non-Cold Dark Matter (ncdm) ---
# m_phi = 36.95 eV (predicción canónica forward Paper 6: Σm_ν × (Ω⁴_DNAV + AURA·KAL))
# T_ncdm en unidades de T_nu. Calibrado para k_fs ≈ 0.659 h/Mpc
# La relación: Omega_ncdm ≈ m_ncdm * N_ncdm / (93.14 eV * h^2)
# T_ncdm = T_nu × (Ω_ncdm h² × 93.14 / m_φ)^(1/3) con Ω_ncdm h² = 0.07390
N_ncdm = 1
m_ncdm = 36.95              # eV — predicción canónica Paper 6
T_ncdm = 0.40900            # en unidades de T_nu = (4/11)^1/3 T_CMB
# Esta temperatura reproduce k_fs ~ 0.659 h/Mpc para m=36.95 eV

# --- Neutrinos estándar ---
N_eff = 2.0328              # N_eff - 1 para dejar espacio al ncdm
T_cmb = 2.7255

# --- Primordial spectrum ---
n_s = 0.96556
A_s = 2.1e-9
k_pivot = 0.05

# --- Hubble SSEE ---
h = 0.67962

root = output/ssee_v36_twosector_
overwrite_root = yes
