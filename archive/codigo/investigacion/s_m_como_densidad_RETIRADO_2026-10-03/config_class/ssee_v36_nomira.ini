# ============================================================
# CLASS input file: SSEE-V3.6 — SIN MIRA (Ω_m puro dinámico)
# Este es el test crítico: ¿qué pasa si usamos Ω_m,dyn = 0.160
# directamente, SIN el factor de mapeo MIRA?
# ============================================================

output = tCl,pCl,lCl,mPk
lensing = yes
l_max_scalars = 2500
P_k_max_h/Mpc = 1.0

# --- SSEE Dark Energy ---
Omega_fld = 0.8399
w0_fld = -0.8399
wa_fld = -0.6699
cs2_fld = 1.0

# --- Sector materia SIN MIRA: Ω_m,dyn = 0.160 ---
Omega_b = 0.048432               # Omega_b h^2 = 0.02237 → 0.02237/h² con h=0.67962
Omega_cdm = 0.111568             # 0.160 - 0.048432
N_eff = 3.046
T_cmb = 2.7255

# --- Primordial spectrum ---
n_s = 0.96556
A_s = 2.1e-9
k_pivot = 0.05

# --- Hubble SSEE ---
h = 0.67962

root = output/ssee_v36_nomira_
overwrite_root = yes
