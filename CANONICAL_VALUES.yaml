        nota:    "zeta_tilde/(tau_Pi H0) = Omega_DE, con zeta_tilde normalizada
                  a la entalpia — misma cantidad, mismo valor"
    op_abierto: "OP-22b"

# ════════════════════════════════════════════════════════════════════════
# PROCEDENCIA — la CADENA de cada canónico (añadido 2026-07-25)
#
# POR QUÉ EXISTE. El factor 0.960318 vivió meses en el modelo sin origen: no
# correspondía a ninguna constante documentada (implicaba C_ν≈93.86, ni 94.07
# ni 93.14 — ver OP-20). Sobrevivió porque NO HABÍA NINGÚN CAMPO donde tuviera
# que declarar de dónde salía. Y cuando C_ν cambió de 94.07 a 93.14, nada supo
# qué había que re-propagar, porque la cadena de dependencias no estaba escrita
# en ninguna parte: vivía en la cabeza de quien hacía el cambio.
#
# REGLA. Todo canónico declara CUATRO cosas:
#   formula      — cómo se construye (no el número: la construcción)
#   origin       — de qué está hecho: algebraico (φ,π) | input SM | derivado
#   source       — dónde se deriva y qué script/log lo reproduce
#   depends_on / affects — la cadena hacia arriba y hacia abajo
#
# Un canónico sin `source` es un número sin fuente. Vigilado por R26.
#
# ESTA SECCIÓN ES DOCUMENTAL: los valores vigentes siguen siendo las claves
# escalares de `canonical:` arriba. Aquí se registra su procedencia.
# ════════════════════════════════════════════════════════════════════════
# ════════════════════════════════════════════════════════════════════════
# POLÍTICA DE REDONDEO  (decisión de Mike, 2026-07-25)
# ════════════════════════════════════════════════════════════════════════
# Un redondeo suelto es una fuente de error propia: un solo decimal arrastra a
# los siguientes, y decir un número y usar otro ES un error aunque el valor esté
# «casi bien». Peor: genera desconfianza justo donde el modelo promete precisión.
# Por eso el redondeo se FIJA, no se decide caso por caso.
#
#   • Álgebra SSEE (φ, π y sus entidades):   12 decimales
#     Son irracionales infinitos; 12 decimales evita que dos derivaciones del
#     MISMO número discrepen por truncado.
#   • Cantidades del modelo (ω_m, Ω_m, w₀, wₐ, n_s, …):   6 decimales
#
# ⚠️ 6 y 12 son TECHOS, no relleno. Aplican a cantidades ALGEBRAICAS, que tienen
# infinitos decimales y por tanto siempre hay un dígito más que mostrar. NO se
# pueden aplicar a un número FINITO o MEDIDO: rellenar C_ν = 93.14 hasta
# 93.140000 afirma cuatro decimales que nadie midió — falsa precisión, y encima
# ATRAVIESA R30 porque numéricamente «es correcto» (|93.140000 − 93.14| = 0).
# Regla: ningún valor se muestra con más decimales de los que tiene su fuente.
#   - algebraico → hasta el techo (6 / 12)
#   - medido     → la precisión del experimento (C_ν 2 dec, KiDS 3 dec, …)
# Los titulares redondeados siguen siendo legítimos: w₀ = −0.840 a 3 decimales
# PASA R30 (|0.840 − 0.839950| = 5.0e-5 ≤ 5e-4). Lo ilegítimo es usar el
# redondeo dentro de un cálculo, no exhibirlo.
#
# REGLA DE VERIFICACIÓN (R30). El valor mostrado debe ser el redondeo CORRECTO
# de la cantidad exacta: |mostrado − exacto| ≤ media unidad del último decimal.
# NO se exige que «la cadena mostrada reproduzca»: las cadenas AMPLIFICAN. Con
# ω_m = 0.142668 (6 dec, correcto) la división mostrada da Ω_m = 0.308882
# mientras el valor exacto es 0.308881 — el redondeo de ω_m ya mueve el último
# dígito. Por eso se verifica contra la cantidad exacta, no contra la división
# de los dígitos exhibidos.
#
# CASO QUE ORIGINÓ LA POLÍTICA: Ω_m se publicaba con un 9 final (5 decimales) en
# 157 sitios de 14 documentos. El exacto es 0.308880879 → correcto 0.308881. El
# dígito de más salía de redondear ω_m a 0.14267 (sube desde 0.1426675) y dividir
# ESE número: intermedios redondeados, ningún valor rancio. El literal viejo
# distaba 9.1e-6 del exacto — más de media unidad del 5º decimal → R30 lo caza.
#
# OJO con los titulares: w₀ = −0.840 y wₐ = −0.670 también son redondeos
# (−0.839950 y −0.669975). Son legítimos como titular; lo ilegítimo es USAR el
# redondeo en un cálculo. Ver R22 (precisión falsa) y R30.
rounding_policy:
  algebra_ssee_decimals: 12
  model_quantities_decimals: 6
  rule: "|mostrado − exacto| <= media unidad del último decimal mostrado"
  # ⚠ CORRECCIÓN 2026-07-26. Aquí se escribió, y duró media hora, que el salto
  # 67.7872 → 67.7869 era «ruido estocástico entre corridas». ERA FALSO:
  # ssee_paper2_mcmc_reframe.py fija np.random.default_rng(42), o sea el MCMC es
  # DETERMINISTA — con los mismos ingredientes devuelve el mismo dígito siempre.
  # Un cambio de resultado NO puede ser ruido; prueba que cambió un ingrediente.
  # Y cambió: el log viejo imprime Ω_m = 0.30889, que solo sale de Σm_ν = 0.06902
  # (el valor RANCIO); el correcto 0.06849 da 0.308881 → se imprimiría 0.30888.
  # Esa corrida estaba contaminada. Ver [[project-stale-constant-drift-mechanism]].
  # LECCIÓN: «es ruido» es la excusa por defecto ante una discrepancia pequeña.
  # Antes de usarla hay que probar que la fuente de ruido EXISTE. Con semilla
  # fija no existe, y la discrepancia siempre significa algo.
  # ── DIMENSIONALES: la precisión la fija el DATO, no el álgebra ────────
  # Los 6/12 decimales rigen para las constantes PURAS en φ,π (adimensionales:
  # Ω, β, KAL₀, P_sc, K_v, T_r, M_v, w₀, wₐ, AURA). Una cantidad CON UNIDADES
  # se compara contra una medición y debe llevar la precisión de ESA medición:
  # escribir H₀ con seis decimales frente a SH0ES 73.04 —publicado con dos— no
  # es rigor, es falsa precisión, y además hace incomparables los dos números.
  # Regla: dimensional → hasta el decimal que el dato de comparación sostiene.
  #   H₀ ancla algebraica  → 67.962   (3 dec; el dato Planck trae ±0.54)
  #   H₀ local SH0ES       → 73.04    (2 dec, como lo publicó Riess+2022)
  #   m_φ                  → 40.70 eV (2 dec)
  # R37 no exige 6 decimales cuando detecta una unidad detrás del número.
  mcmc_posterior_decimals: 2      # se publica 67.79 ± 0.35, no 67.7872 ± 0.352
  mcmc_posterior_rule: >
    Un posterior se publica hasta el dígito que fija su propia barra de error
    (±0.35 → dos decimales). La razón NO es estocasticidad —el muestreo es
    determinista— sino convención de cifras significativas: los dígitos por
    debajo del error no son información, y sí son superficie donde un ingrediente
    equivocado se esconde a la vista. El valor largo vive en el log y en el
    Registro (procedencia string-exacta), NUNCA en el cuerpo del paper.
  # NO se implementó una regla automática «decimales(valor) <= decimales(error)»
  # sobre los .tex: barre 40 casos de los cuales la mayoría son datos AJENOS
  # citados como sus autores los publicaron (SH0ES 73.04±1.04, Freedman
  # 69.96±1.54, DESI w_a=−0.631±0.226). Reescribirlos falsearía la cita, y una
  # alarma que grita en falso 40 veces se termina ignorando. Pendiente anotado:
  # revisar a mano si 67.962±0.54 (ancla algebraica + anchura de Planck) debe
  # seguir escribiéndose así.

