# CANTIDADES QUE SE CALCULAN EN MÁS DE UN DOCUMENTO (añadido 2026-08-02)
#
# POR QUÉ EXISTE. OP-22: la corrección viscosa ζ/(ρ·τ_Π) vale 1 en
# SSEE_EFT_section.tex (es así como se DERIVÓ τ_Π, poniendo c²_s=1 en la
# frontera de causalidad) y 0.839950 en SSEE_Paper5_IS.tex. Es la MISMA
# cantidad física con dos valores. De ahí sale el c²_s=0 de Paper 5, que es
# un artefacto de mezclar normalizaciones entre documentos.
#
# Ninguna capa lo veía porque CADA NÚMERO, POR SEPARADO, ES CORRECTO Y
# TRAZABLE. R26 verifica que la fórmula de un canónico recompute su valor;
# nadie preguntaba «esta cantidad, calculada en el documento A y en el B,
# ¿da lo mismo?».
#
# Mike lo había pedido al crear el sistema de procedencia: que todo valor
# tenga origen, fórmula, verificación de dónde sale Y dónde se cita.
# Esta sección cierra la última parte.
#
# Vigilado por R48. Una entrada con `op_abierto` cuenta como DEUDA
# declarada (no rompe el guardián, pero el contador sólo puede BAJAR).
# Una sin `op_abierto` y con valores discrepantes es ROJO.
# ════════════════════════════════════════════════════════════════════════
cross_document:
  - id: IS_viscous_correction
    que_es: "zeta/((rho+p)*tau_Pi) — la correccion viscosa que se suma a c2_s_bare.
             OP-22 CERRADO 2026-09-06: el divisor es la ENTALPIA rho+p (test de
             limite w->-1: una constante cosmologica no puede tener presion
             viscosa). Testigo: F~186 del apendice de autovalores de P5 sale
             185.05 con entalpia y 1370 con rho_crit."
    tolerancia: 1.0e-4
    documentos:
      - archivo: "manuscript/SSEE_EFT_section.tex"
        ancla:   "eq:tau_IS"
        valor:   0.839950
        nota:    "tau_Pi H0 = KAL0*Omega/T_r es ALGEBRA; la derivacion por
                  saturacion de causalidad queda RETIRADA (usaba rho, daba 0.2946)"
      - archivo: "manuscript/SSEE_Paper5_IS.tex"
